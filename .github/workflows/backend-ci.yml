name: Backend CI

# This file has to live at the REPO ROOT. GitHub only reads workflows from the
# root .github/workflows/ — a copy under backend/.github/workflows/ is silently
# ignored and never runs. The Django project itself lives in backend/, so every
# `run:` step below is executed from there via defaults.run.working-directory.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# The path filters above keep frontend-only changes from spinning up Postgres
# and Redis for nothing. Note for later: if main ever gets branch protection
# with "Backend CI" as a *required* status check, a frontend-only PR will sit
# waiting for a check that never runs. Either drop the filters then, or add a
# skip job that reports success.

jobs:
  test:
    runs-on: ubuntu-latest

    # Everything below runs inside backend/, which is the Django project root
    # (manage.py, pytest.ini, pyproject.toml and requirements*.txt all live
    # there). Without this every step would run at the repo root and fail.
    defaults:
      run:
        working-directory: backend

    # Real Postgres + Redis so migrations, the migration-drift check, and the
    # test suite run against the same engines as production (not sqlite).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hephzibah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # settings.py fails fast at boot on any missing required key, so CI must
    # supply them all. These are throwaway CI values, never real secrets.
    env:
      DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-secret-key-not-for-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/hephzibah"
      # The only Redis this project needs — the cache. There is no broker
      # (backend/docs/adr/0001-remove-celery.md), so REDIS_URL / CELERY_* are gone.
      CACHE_REDIS_URL: "redis://localhost:6379/1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      FRONTEND_BASE_URL: "http://localhost:3000"
      BREVO_API_KEY: "ci-test-key"
      # The 13 template IDs are read as ints; any value works for CI.
      BREVO_TEMPLATE_NEW_REMINDER: "1"
      BREVO_TEMPLATE_PAYMENT_DUE: "1"
      BREVO_TEMPLATE_MEETING_PREP_DUE: "1"
      BREVO_TEMPLATE_PHASE_ADVANCED: "1"
      BREVO_TEMPLATE_EVENT_DETAILS_UPDATED: "1"
      BREVO_TEMPLATE_DOCUMENT_ADDED: "1"
      BREVO_TEMPLATE_INVOICE_ISSUED: "1"
      BREVO_TEMPLATE_RECEIPT_ISSUED: "1"
      BREVO_TEMPLATE_MILESTONE_PAID: "1"
      BREVO_TEMPLATE_USER_CREDENTIALS: "1"
      BREVO_TEMPLATE_PASSWORD_RESET: "1"
      BREVO_TEMPLATE_INQUIRY_RECEIVED: "1"
      BREVO_TEMPLATE_INQUIRY_SUBMITTED_INTERNAL: "1"

    steps:
      - uses: actions/checkout@v4

      # 3.12 to match backend/.python-version and the dev venv. `with:` inputs
      # are NOT affected by working-directory, so cache-dependency-path has to
      # be spelled out relative to the repo root.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Blocking. The codebase was baselined with a one-off `ruff check --fix`
      # plus four hand-fixes, so this is green as of that commit and can only be
      # broken by new code.
      #
      # `ruff format` is deliberately NOT run here or in the baseline: it would
      # reformat 104 files, and `quote-style = "preserve"` aside, this codebase's
      # hand-alignment and long explanatory comment blocks are intentional. The
      # rules that catch real problems (F, E, I) are what gate.
      #
      # One noqa in the tree is load-bearing: apps/portal/apps.py imports
      # apps.portal.signals for its side effects, and --fix deleted it once,
      # silently disabling client-portal creation. Ruff cannot see side-effect
      # imports; don't "clean up" a `# noqa: F401` on one.
      #
      # This one step overrides working-directory back to the repo root: the
      # `github` output format emits annotations whose paths GitHub resolves
      # from the root, so linting from inside backend/ would file every warning
      # against a nonexistent top-level path. Ruff still applies
      # backend/pyproject.toml, which it discovers upward from each file.
      - name: Lint (ruff)
        working-directory: .
        run: ruff check --output-format=github backend

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django deploy checks
        run: python manage.py check --deploy

      # --cov-fail-under is pinned at the coverage of the commit that introduced
      # it, so the number can only go up. Raise it when it climbs; never lower it
      # to make a red build green.
      - name: Run tests
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=77

      # A fresh CI database has never had django_celery_beat installed, so
      # apps/core/0001_drop_celery_beat_tables is a no-op there — which is
      # exactly what the `IF EXISTS` in it is for. This step proves the whole
      # migration chain still applies from empty, which is the one thing a
      # `--reuse-db` test run cannot tell us.
      - name: Migrate a fresh database
        env:
          PGPASSWORD: postgres
          DATABASE_URL: "postgres://postgres:postgres@localhost:5432/freshcheck"
        run: |
          createdb -h localhost -U postgres freshcheck
          python manage.py migrate --noinput

      # The GROUPS table in run_scheduled.py is the entire schedule now. A typo
      # in a dotted path is a task that silently never runs, so resolve them all.
      - name: Verify the scheduled-task groups resolve
        run: python manage.py run_scheduled --list
