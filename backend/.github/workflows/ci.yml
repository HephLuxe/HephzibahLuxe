name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres + Redis so migrations, the migration-drift check, and the
    # test suite run against the same engines as production (not sqlite).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hephzibah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # settings.py fails fast at boot on any missing required key, so CI must
    # supply them all. These are throwaway CI values, never real secrets.
    env:
      DEBUG: "False"
      DJANGO_SECRET_KEY: "ci-secret-key-not-for-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/hephzibah"
      REDIS_URL: "redis://localhost:6379/0"
      CACHE_REDIS_URL: "redis://localhost:6379/1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      FRONTEND_BASE_URL: "http://localhost:3000"
      BREVO_API_KEY: "ci-test-key"
      # The 11 template IDs are read as ints; any value works for CI.
      BREVO_TEMPLATE_NEW_REMINDER: "1"
      BREVO_TEMPLATE_PAYMENT_DUE: "1"
      BREVO_TEMPLATE_MEETING_PREP_DUE: "1"
      BREVO_TEMPLATE_PHASE_ADVANCED: "1"
      BREVO_TEMPLATE_EVENT_DETAILS_UPDATED: "1"
      BREVO_TEMPLATE_DOCUMENT_ADDED: "1"
      BREVO_TEMPLATE_INVOICE_ISSUED: "1"
      BREVO_TEMPLATE_RECEIPT_ISSUED: "1"
      BREVO_TEMPLATE_MILESTONE_PAID: "1"
      BREVO_TEMPLATE_USER_CREDENTIALS: "1"
      BREVO_TEMPLATE_PASSWORD_RESET: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        # continue-on-error until the codebase is baselined with a one-off
        # `ruff check --fix && ruff format`; remove this line to make lint blocking.
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django deploy checks
        run: python manage.py check --deploy

      - name: Run tests
        run: pytest --cov=apps --cov-report=term-missing
